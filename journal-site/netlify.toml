[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pdf-lib", "@pdf-lib/fontkit", "qrcode", "nodemailer"]

[functions."api"]
  included_files = ["public/fonts/*.ttf", "public/brand/*"]

[functions."paper-page"]
  included_files = ["dist/index.html"]
